name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn matplotlib pillow pyspellchecker pytest
      - run: cd autocorrect-keyboard-system && python -m pytest -q
      - run: cd boston-house-price-prediction && python -m pytest -q
      - run: cd image-tagging-tensorflow && python -m pytest -q tests/test_demo_dataset.py
